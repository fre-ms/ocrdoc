[project]
name = "ocrdoc"
version = "0.4.0"
description = "Recognises what is on the pages of a PDF or on a picture: areas, OCR with word boxes, tables, barcodes; the document stays as it is, the result is reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "fre.ms", email = "fre.ms@fre.ms" }]
keywords = ["ocr", "document", "layout", "tables", "barcodes", "pdf", "searchable-pdf", "tesseract", "rapidocr"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
  "Topic :: Text Processing",
]
dependencies = [
  # the core the tools of docrepro share: configuration documents, errors, the command
  # line's manners, no network, the window's building blocks
  "doccor>=0.2",
  # <2: PyMuPDF 2.0 (MuPDF 1.28.5) shifts glyphs after a redaction; ocrdoc's pages are
  # redacted by PseudonyMed, so both pin the same range
  "pymupdf>=1.25,<2",
  # a picture is read as a picture: Pillow opens it (PNG, TIFF, WebP … as well as JPEG)
  "pillow>=11",
]

[project.optional-dependencies]
# RapidOCR brings OpenCV and NumPy, which the filters and the finders need as well
# pillow-heif: HEIC and HEIF photos are read as well
ocr = ["rapidocr>=3", "onnxruntime>=1.18", "pillow-heif>=0.18"]
tables = [
    "camelot-py>=2.2",
]
gui = [
    "pyside6-essentials>=6.8",
]
# finds and reads barcodes (QR, DataMatrix, PDF417, Code 128, EAN …) as areas of a page
barcodes = [
    "zxing-cpp>=2.3",
]

[tool.uv.sources]
# a released tag: ocrdoc moves to a new doccor on purpose
doccor = { git = "https://github.com/fre-ms/doccor", tag = "v0.2.0" }

[project.scripts]
ocrdoc = "ocrdoc.cli:main"

[project.urls]
Source = "https://github.com/fre-ms/ocrdoc"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocrdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
